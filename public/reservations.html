<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations - Glassmorphism Hotel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 40px;
            color: #818cf8;
            text-align: center;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: block;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.4);
            color: #fff;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.12);
        }

        .input-group select option {
            background: #1e1b4b;
            color: #fff;
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 500;
            color: #cbd5e1;
        }

        td {
            color: #e2e8f0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>Hotel Admin</h2>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="reservations.html" class="active">Reservations</a></li>
            </ul>
        </div>
        <div class="logout-btn" id="logoutBtn">Logout</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Reservations Management</h1>
        </div>

        <div class="form-container">
            <div class="section-title" style="font-size: 18px; margin-bottom: 15px;">New Reservation</div>
            <form id="addReservationForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Select Customer</label>
                        <select id="customerSelect" required>
                            <option value="">Select customer...</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Select Room</label>
                        <select id="roomSelect" required>
                            <option value="">Select room...</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Check In</label>
                        <input type="date" id="checkIn" required>
                    </div>
                    <div class="input-group">
                        <label>Check Out</label>
                        <input type="date" id="checkOut" required>
                    </div>
                </div>
                <button type="submit" class="btn">Create Reservation</button>
            </form>
        </div>

        <div class="section-title">All Reservations</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Room</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Total ($)</th>
                </tr>
            </thead>
            <tbody id="reservationsTable">
                <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadDropdowns() {
            try {
                const cRes = await fetch('/api/customers');
                const customers = await cRes.json();
                const cSelect = document.getElementById('customerSelect');
                customers.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = `${c.full_name} (${c.email})`;
                    cSelect.appendChild(opt);
                });

                const rRes = await fetch('/api/rooms');
                const rooms = await rRes.json();
                const rSelect = document.getElementById('roomSelect');
                rooms.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = `Room ${r.room_number} - ${r.room_type} ($${r.price})`;
                    rSelect.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function loadReservations() {
            try {
                const res = await fetch('/api/reservations');
                const reservations = await res.json();
                const tbody = document.getElementById('reservationsTable');
                tbody.innerHTML = '';

                if (reservations.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No reservations found</td></tr>';
                    return;
                }

                reservations.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${r.id}</td>
                        <td>${r.full_name}</td>
                        <td>${r.room_number} (${r.room_type})</td>
                        <td>${r.check_in.split('T')[0]}</td>
                        <td>${r.check_out.split('T')[0]}</td> <td>$${r.total_amount}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('addReservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const customer_id = document.getElementById('customerSelect').value;
            const room_id = document.getElementById('roomSelect').value;
            const check_in = document.getElementById('checkIn').value;
            const check_out = document.getElementById('checkOut').value;
            const guests = 2; // Default guests

            try {
                const res = await fetch('/api/reservations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_id, room_id, check_in, check_out, guests })
                });

                if (res.ok) {
                    document.getElementById('addReservationForm').reset();
                    loadReservations();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Failed to create reservation');
                }
            } catch (err) {
                alert('Server error');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/index.html';
        });

        loadDropdowns();
        loadReservations();
    </script>
</body>
</html>
