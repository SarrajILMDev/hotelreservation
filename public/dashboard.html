<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Glassmorphism Hotel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 40px;
            color: #818cf8;
            text-align: center;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: block;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.4);
            color: #fff;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 28px;
            font-weight: 600;
            color: #f8fafc;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 500;
            color: #cbd5e1;
        }

        td {
            color: #e2e8f0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>Hotel Admin</h2>
            <ul class="nav-links">
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="reservations.html">Reservations</a></li>
            </ul>
        </div>
        <div class="logout-btn" id="logoutBtn">Logout</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 id="welcomeUser">Welcome, Admin</h1>
        </div>

        <div class="stats-grid">
            <div class="card">
                <h3>Total Rooms</h3>
                <div class="value" id="totalRooms">-</div>
            </div>
            <div class="card">
                <h3>Available Rooms</h3>
                <div class="value" id="availableRooms">-</div>
            </div>
            <div class="card">
                <h3>Total Customers</h3>
                <div class="value" id="totalCustomers">-</div>
            </div>
            <div class="card">
                <h3>Total Revenue</h3>
                <div class="value" id="totalRevenue">-</div>
            </div>
        </div>

        <div class="section-title">Recent Reservations</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Room</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Total ($)</th>
                </tr>
            </thead>
            <tbody id="recentReservationsTable">
                <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function checkSession() {
            const res = await fetch('/api/session');
            const data = await res.json();
            if (!data.loggedIn) {
                window.location.href = '/index.html';
            } else {
                document.getElementById('welcomeUser').textContent = `Welcome, ${data.username}`;
            }
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('totalRooms').textContent = data.totalRooms || 0;
                    document.getElementById('availableRooms').textContent = data.availableRooms || 0;
                    document.getElementById('totalCustomers').textContent = data.totalCustomers || 0;
                    document.getElementById('totalRevenue').textContent = `$${data.totalRevenue || 0}`;
                }

                const resList = await fetch('/api/reservations');
                const reservations = await resList.json();
                const tbody = document.getElementById('recentReservationsTable');
                tbody.innerHTML = '';

                if (reservations.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No reservations found</td></tr>';
                    return;
                }

                reservations.slice(0, 5).forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${r.id}</td>
                        <td>${r.full_name}</td>
                        <td>${r.room_number} (${r.room_type})</td>
                        <td>${r.check_in.split('T')[0]}</td>
                        <td>${r.check_out.split('T')[0]}</td>
                        <td>$${r.total_amount}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/index.html';
        });

        checkSession();
        loadDashboard();
    </script>
</body>
</html>
